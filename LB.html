<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --bg-header: #000000;
    --text: #ffffff;
    --text-muted: rgba(255,255,255,0.5);
    --accent: #ff3366;
    --accent-glow: rgba(255,51,102,0.3);
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --card-hover-border: rgba(255,51,102,0.3);
    --font-main: 'Manrope', sans-serif;
    --font-display: 'Syncopate', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ========== HEADER ========== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--bg-header);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
  }

  .nav { display: flex; gap: 36px; align-items: center; }

  .nav a {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: color 0.3s;
  }
  .nav a:hover { color: var(--text); }

  .nav-cart {
    position: relative;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-cart svg { width: 20px; height: 20px; stroke: var(--text-muted); transition: stroke 0.3s; }
  .nav-cart:hover svg { stroke: var(--text); }
  .cart-count {
    position: absolute;
    top: 2px; right: 0;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }

  /* ========== NEURAL CANVAS ========== */
  #neural-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ========== HERO ========== */
  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 40px 80px;
  }

  .hero-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s 0.3s forwards;
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 8vw, 120px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(40px);
    animation: fadeUp 1s 0.5s forwards;
  }

  .hero h1 span { color: var(--accent); }

  .hero-desc {
    max-width: 500px;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s 0.7s forwards;
  }

  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 40px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 60px;
    background: transparent;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.4s;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s 0.9s forwards;
    text-decoration: none;
  }
  .hero-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 40px var(--accent-glow);
  }
  .hero-btn svg { width: 16px; height: 16px; transition: transform 0.3s; }
  .hero-btn:hover svg { transform: translateX(4px); }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========== PRODUCTS SECTION ========== */
  .products-section {
    position: relative;
    z-index: 1;
    padding: 40px 40px 120px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 60px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .section-header h2 {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.03em;
  }

  .section-header p {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* ========== FILTER TAGS ========== */
  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .filter-tag {
    padding: 8px 20px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-main);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .filter-tag:hover, .filter-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ========== PRODUCT GRID ========== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  .product-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    opacity: 0;
    transform: translateY(40px);
  }
  .product-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .product-card:hover {
    border-color: var(--card-hover-border);
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px var(--accent-glow);
  }

  .product-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
  }

  .product-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(30%) brightness(0.9);
    transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .product-card:hover .product-img-wrap img {
    filter: grayscale(0%) brightness(1);
    transform: scale(1.05);
  }

  .product-badge {
    position: absolute;
    top: 16px; left: 16px;
    padding: 6px 14px;
    background: var(--accent);
    border-radius: 40px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #fff;
  }

  /* ========== HEART / BRAIN BUTTON ========== */
  .like-btn {
    position: absolute;
    top: 16px; right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 2;
    overflow: hidden;
  }
  .like-btn:hover {
    background: rgba(0,0,0,0.7);
    border-color: rgba(255,255,255,0.2);
    transform: scale(1.1);
  }
  .like-btn:active { transform: scale(0.9); }

  .like-btn .icon {
    position: absolute;
    width: 22px; height: 22px;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }

  .like-btn .icon-heart {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .like-btn .icon-brain {
    opacity: 0;
    transform: scale(0) rotate(-180deg);
  }

  .like-btn.liked .icon-heart {
    opacity: 0;
    transform: scale(0) rotate(180deg);
  }
  .like-btn.liked .icon-brain {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .like-btn.liked {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .like-btn .burst {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .like-btn.liked .burst { animation: burstOut 0.6s ease-out forwards; }
  .like-btn .burst:nth-child(3) { --angle: 0deg; --dist: 20px; animation-delay: 0s; }
  .like-btn .burst:nth-child(4) { --angle: 60deg; --dist: 24px; animation-delay: 0.03s; }
  .like-btn .burst:nth-child(5) { --angle: 120deg; --dist: 18px; animation-delay: 0.06s; }
  .like-btn .burst:nth-child(6) { --angle: 180deg; --dist: 22px; animation-delay: 0.02s; }
  .like-btn .burst:nth-child(7) { --angle: 240deg; --dist: 20px; animation-delay: 0.05s; }
  .like-btn .burst:nth-child(8) { --angle: 300deg; --dist: 26px; animation-delay: 0.04s; }

  @keyframes burstOut {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(calc(cos(var(--angle)) * var(--dist)), calc(sin(var(--angle)) * var(--dist))) scale(0); }
  }

  /* ========== PRODUCT INFO ========== */
  .product-info { padding: 24px; }

  .product-category {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .product-name {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .product-desc {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .product-price {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .add-btn {
    padding: 10px 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .add-btn:hover {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ========== TOAST ========== */
  .toast-container {
    position: fixed;
    bottom: 32px; right: 32px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .toast {
    padding: 16px 24px;
    background: rgba(20,20,30,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateX(120%);
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(0); }
  .toast .toast-icon { font-size: 16px; }

  /* ========== FOOTER ========== */
  .footer {
    position: relative;
    z-index: 1;
    padding: 60px 40px 40px;
    border-top: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }

  .footer-logo {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .footer p {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .header-inner { padding: 14px 20px; }
    .nav { display: none; }
    .hero { padding: 100px 20px 60px; }
    .products-section { padding: 20px 20px 80px; }
    .section-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .toast-container { bottom: 16px; right: 16px; left: 16px; }
    .toast { font-size: 12px; padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">Love Brain</div>
    <nav class="nav">
      <a href="#">Новинки</a>
      <a href="#">Женское</a>
      <a href="#">Мужское</a>

      <div class="nav-cart" onclick="showToast('🛒 Корзина пока пуста')">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z"/>
        </svg>
        <span class="cart-count">0</span>

</header>

<!-- NEURAL BACKGROUND -->
<canvas id="neural-bg"></canvas>

<!-- HERO -->
<section class="hero">

  <p class="hero-desc">Где эмоции встречаются с разумом. Одежда для тех, кто чувствует головой и думает сердцем.</p>
  <a href="#products" class="hero-btn">

    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">

<script>
// ===================== NEURAL BACKGROUND =====================
const canvas = document.getElementById('neural-bg');
const ctx = canvas.getContext('2d');

let nodes = [];
const NODE_COUNT = 50;
const CONNECTION_DIST = 320;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });

function drawHeart(cx, cy, size, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  const s = size;
  ctx.moveTo(cx, cy + s * 0.3);
  ctx.bezierCurveTo(cx, cy - s * 0.1, cx - s * 0.6, cy - s * 0.4, cx - s * 0.6, cy);
  ctx.bezierCurveTo(cx - s * 0.6, cy + s * 0.4, cx, cy + s * 0.7, cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx, cy + s * 0.7, cx + s * 0.6, cy + s * 0.4, cx + s * 0.6, cy);
  ctx.bezierCurveTo(cx + s * 0.6, cy - s * 0.4, cx, cy - s * 0.1, cx, cy + s * 0.3);
  ctx.fill();
  ctx.restore();
}

function initNodes() {
  nodes = [];
  for (let i = 0; i < NODE_COUNT; i++) {
    nodes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: 7 + Math.random() * 9,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.008 + Math.random() * 0.015,
    });
  }
}
initNodes();

let globalTime = 0;

function animateNeural() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  globalTime += 0.01;

  // Draw connections with glow
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONNECTION_DIST) {
        const t = 1 - dist / CONNECTION_DIST;
        const alpha = t * 0.55;
        const lineWidth = 1 + t * 2.5;

        // Внешний glow-слой
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 51, 102, ${alpha * 0.4})`;
        ctx.lineWidth = lineWidth + 4;
        ctx.lineCap = 'round';
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();

        // Основная линия
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 80, 130, ${alpha})`;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();

        // Яркая сердцевина линии
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 180, 200, ${alpha * 0.5})`;
        ctx.lineWidth = Math.max(0.5, lineWidth - 1.5);
        ctx.lineCap = 'round';
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }

  // Update & draw nodes
  for (const node of nodes) {
    node.x += node.vx;
    node.y += node.vy;
    node.pulse += node.pulseSpeed;

    if (node.x < -30) node.x = canvas.width + 30;
    if (node.x > canvas.width + 30) node.x = -30;
    if (node.y < -30) node.y = canvas.height + 30;
    if (node.y > canvas.height + 30) node.y = -30;

    const pulseFactor = 1 + Math.sin(node.pulse) * 0.25;
    const drawSize = node.size * pulseFactor;
    const alpha = 0.4 + Math.sin(node.pulse) * 0.2;

    // Большой размытый glow
    ctx.save();
    ctx.shadowColor = 'rgba(255, 51, 102, 0.7)';
    ctx.shadowBlur = 30;
    drawHeart(node.x, node.y - drawSize * 0.3, drawSize, '#ff3366', alpha);
    ctx.restore();

    // Яркое ядро сердца
    drawHeart(node.x, node.y - drawSize * 0.3, drawSize * 0.7, '#ff8aaa', alpha * 0.6);
  }

  requestAnimationFrame(animateNeural);
}
animateNeural();

// ===================== PRODUCTS DATA =====================
const products = [
  { id: 1, name: 'Худи «Нейронный импульс»', category: 'hoodie', badge: 'New', desc: 'Оверсайз худи с принтом нейронной сети. 80% хлопок, 20% полиэстер.', price: '6 990', img: 'https://picsum.photos/seed/lovebrain-hoodie1/600/800.jpg' },
  { id: 2, name: 'Футболка «Синапс»', category: 'tshirt', badge: null, desc: 'Плотная футболка с минималистичным графическим принтом.', price: '3 490', img: 'https://picsum.photos/seed/lovebrain-tshirt1/600/800.jpg' },
  { id: 3, name: 'Куртка «Кортикальная оболочка»', category: 'jacket', badge: 'Хит', desc: 'Лёгкая ветровка с водоотталкивающей пропиткой и рефлекторными элементами.', price: '12 990', img: 'https://picsum.photos/seed/lovebrain-jacket1/600/800.jpg' },
  { id: 4, name: 'Штаны «Дофаминовый поток»', category: 'pants', badge: null, desc: 'Широкие парашютные штаны с карманами на молнии.', price: '5 490', img: 'https://picsum.photos/seed/lovebrain-pants1/600/800.jpg' },
  { id: 5, name: 'Худи «Амплитуда чувств»', category: 'hoodie', badge: null, desc: 'Утеплённое худи с крупной вышивкой-сердцем.', price: '7 990', img: 'https://picsum.photos/seed/lovebrain-hoodie2/600/800.jpg' },
  { id: 6, name: 'Футболка «Лимбическая система»', category: 'tshirt', badge: 'New', desc: 'Базовая футболка с шрифтовым принтом по груди.', price: '2 990', img: 'https://picsum.photos/seed/lovebrain-tshirt2/600/800.jpg' },
  { id: 7, name: 'Куртка «Миелиновый барьер»', category: 'jacket', badge: null, desc: 'Кожаная куртка-бомбер с мягкой подкладкой.', price: '18 990', img: 'https://picsum.photos/seed/lovebrain-jacket2/600/800.jpg' },
  { id: 8, name: 'Штаны «Рефлекс»', category: 'pants', badge: 'Хит', desc: 'Брюки-карго с регулируемым низом и накладными карманами.', price: '4 990', img: 'https://picsum.photos/seed/lovebrain-pants2/600/800.jpg' },
];

const categoryLabels = { hoodie: 'Худи', tshirt: 'Футболки', jacket: 'Куртки', pants: 'Штаны' };

const heartSVG = `<svg class="icon icon-heart" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

const brainSVG = `<svg class="icon icon-brain" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2C9.5 2 7 4 7 6.5c0 .5.1 1 .2 1.5C5.5 8.5 4 10.5 4 12.5 4 15 6 17 8.5 17c.5 0 1-.1 1.5-.2.5 1.5 2 2.7 3.5 3-1.5-.3-3-1.5-3.5-3-.5.1-1 .2-1.5.2C6 17 4 15 4 12.5c0-2 1.5-4 3.2-4.5C7.1 7.5 7 7 7 6.5 7 4 9.5 2 12 2z"/>
  <path d="M12 2c2.5 0 5 2 5 4.5 0 .5-.1 1-.2 1.5C18.5 8.5 20 10.5 20 12.5c0 2.5-2 4.5-4.5 4.5-.5 0-1-.1-1.5-.2-.5 1.5-2 2.7-3.5 3 1.5-.3 3-1.5 3.5-3 .5.1 1 .2 1.5.2C18 17 20 15 20 12.5c0-2-1.5-4-3.2-4.5.1-.5.2-1 .2-1.5C17 4 14.5 2 12 2z"/>
  <path d="M12 6v12M9 9c1.5.5 2 1.5 2 3M15 9c-1.5.5-2 1.5-2 3M9 15c1.5-.5 2-1.5 2-3M15 15c-1.5-.5-2-1.5-2-3"/>
</svg>`;

function renderProducts(filter = 'all') {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '';
  const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

  filtered.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.dataset.category = p.category;
    card.style.transitionDelay = `${i * 0.08}s`;
    card.innerHTML = `
      <div class="product-img-wrap">
        <img src="${p.img}" alt="${p.name}" loading="lazy">
        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
        <button class="like-btn" onclick="toggleLike(this)">
          ${heartSVG}${brainSVG}
          <span class="burst"></span><span class="burst"></span><span class="burst"></span>
          <span class="burst"></span><span class="burst"></span><span class="burst"></span>
        </button>
      </div>
      <div class="product-info">
        <div class="product-category">${categoryLabels[p.category]}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-bottom">
          <div class="product-price">${p.price} ₽</div>
          <button class="add-btn" onclick="addToCart('${p.name}')">В корзину</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.product-card').forEach(c => c.classList.add('visible'));
  });
}

renderProducts();

// ===================== FILTERS =====================
document.querySelectorAll('.filter-tag').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts(btn.dataset.filter);
  });
});

// ===================== LIKE BUTTON (без уведомлений) =====================
function toggleLike(btn) {
  btn.classList.toggle('liked');
}

// ===================== ADD TO CART =====================
let cartCount = 0;
function addToCart(name) {
  cartCount++;
  document.querySelector('.cart-count').textContent = cartCount;
  showToast('✅ Добавлено: ' + name);
}

// ===================== TOAST =====================
function showToast(message) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="toast-icon"></span>${message}`;
  container.appendChild(toast);
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 2500);
}
</script>
