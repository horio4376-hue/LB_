<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Brain</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">Love Brain</div>
    <nav class="nav">
      <a href="#">Новинки</a>
      <a href="#">Женское</a>
      <a href="#">Мужское</a>
      <a href="#">Аксессуары</a>
      <div class="nav-cart" onclick="showToast('🛒 Корзина пока пуста')">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z"/>
        </svg>
        <span class="cart-count">0</span>
      </div>
    </nav>
  </div>
</header>

<!-- NEURAL BACKGROUND -->
<canvas id="neural-bg"></canvas>

<!-- HERO -->
<section class="hero">
  <div class="hero-label">Коллекция 2025</div>
  <h1>Love<br><span>Brain</span></h1>
  <p class="hero-desc">Где эмоции встречаются с разумом. Одежда для тех, кто чувствует головой и думает сердцем.</p>
  <a href="#products" class="hero-btn">
    Смотреть каталог
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"/>
    </svg>
  </a>
</section>

<!-- PRODUCTS -->
<section class="products-section" id="products">
  <div class="section-header">
    <h2>Каталог</h2>
    <p>8 товаров</p>
  </div>

  <div class="filters">
    <button class="filter-tag active" data-filter="all">Все</button>
    <button class="filter-tag" data-filter="hoodie">Худи</button>
    <button class="filter-tag" data-filter="tshirt">Футболки</button>
    <button class="filter-tag" data-filter="jacket">Куртки</button>
    <button class="filter-tag" data-filter="pants">Штаны</button>
  </div>

  <div class="product-grid" id="product-grid"></div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">Love Brain</div>
  <p>© 2025 Love Brain. Все права защищены. Чувствуй. Думай. Носи.</p>
</footer>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
